<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TarsTutor — Your Personal AI Whiteboard Tutor</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="origin" />
    <meta name="theme-color" content="#1282f4" />
    <meta
      name="description"
      content="Learn any topic with your personal AI tutor. Follow live whiteboard explanations, hear every step, ask questions, and practice at your own pace."
    />
    <meta property="og:site_name" content="TarsTutor" />
    <meta
      property="og:title"
      content="Your personal AI tutor. Teaching live on a whiteboard."
    />
    <meta
      property="og:description"
      content="See every step. Hear the explanation. Ask anything."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/tars-favicon.svg" />
    <% if (typeof PROD != 'undefined' && PROD == true) { %>
    <!-- PLACEHOLDER:EXCALIDRAW_APP_FONTS -->
    <link
      rel="stylesheet"
      href="../packages/excalidraw/fonts/fonts.css"
      type="text/css"
    />
    <% } else { %>
    <script>
      window.EXCALIDRAW_ASSET_PATH = window.origin;
    </script>
    <% } %>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      html {
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to learn with TarsTutor.</noscript>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
